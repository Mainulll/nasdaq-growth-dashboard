name: Month-end portfolio review

on:
  workflow_dispatch:
  schedule:
    # Runs on the first day of each month after the prior US month has closed.
    - cron: "0 22 1 * *"

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate month-end review
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python daily_job.py
      - name: Commit review snapshot
        run: |
          git config user.name "portfolio-agent"
          git config user.email "portfolio-agent@users.noreply.github.com"
          git add data/latest_snapshot.json
          git diff --cached --quiet || git commit -m "Update month-end portfolio review"
          git push
