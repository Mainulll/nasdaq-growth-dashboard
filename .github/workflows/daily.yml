name: Daily portfolio agents

on:
  workflow_dispatch:
  schedule:
    # 21:30 UTC is approximately 07:30 AEST / 08:30 AEDT after the US close.
    - cron: "30 21 * * 1-5"

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run independent agents
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python daily_job.py
      - name: Commit snapshot
        run: |
          git config user.name "portfolio-agent"
          git config user.email "portfolio-agent@users.noreply.github.com"
          git add data/latest_snapshot.json
          git diff --cached --quiet || git commit -m "Update daily portfolio snapshot"
          git push
